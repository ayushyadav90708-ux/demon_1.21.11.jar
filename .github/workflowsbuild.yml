name: Build Heaven

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Resolve newest Fabric versions for Minecraft 1.21.11
        shell: bash
        run: |
          set -u
          MC=1.21.11
          YARN=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version' || true)
          LOADER=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[] | select(.stable == true)][0].version' || true)
          FAPI=$(curl -fsSL "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" \
                 | grep -oP '(?<=<version>)[^<]+' | grep -E "\+${MC//./\\.}$" | tail -1 || true)
          echo "yarn=$YARN loader=$LOADER fabric-api=$FAPI"
          if [ -n "$YARN" ] && [ "$YARN" != "null" ]; then sed -i "s|^yarn_mappings=.*|yarn_mappings=$YARN|" gradle.properties; fi
          if [ -n "$LOADER" ] && [ "$LOADER" != "null" ]; then sed -i "s|^loader_version=.*|loader_version=$LOADER|" gradle.properties; fi
          if [ -n "$FAPI" ]; then sed -i "s|^fabric_version=.*|fabric_version=$FAPI|" gradle.properties; fi
          cat gradle.properties

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: heaven-1.0.0
          path: build/libs/heaven-1.0.0.jar
          if-no-files-found: error
